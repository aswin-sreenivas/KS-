    <!-- Canonical URL Placeholder Script: Dynamically resolves and maintains the canonical URL for each section (home, about, services, projects, contact) -->
    <script>
      (function() {
        try {
          var canonicalLink = document.getElementById('canonical-url');
          var ogUrlMeta = document.getElementById('og-url');
          if (!canonicalLink) return;

          // Base origin placeholder: defaults to authoritative domain or current runtime host
          var defaultBase = 'https://ksassociates.co.in';
          var origin = (window.location && window.location.origin && window.location.origin !== 'null')
            ? window.location.origin
            : defaultBase;

          // Recognized page sections across the application
          var validSections = ['home', 'about', 'services', 'projects', 'contact'];

          // Determine current section from hash routing or path
          var path = (window.location.pathname || '').replace(/\/+$/, '');
          var rawHash = (window.location.hash || '').replace(/^#\/?/, '').toLowerCase();
          var hashSection = rawHash.split('?')[0].split('/')[0];

          var targetSection = '';
          if (validSections.indexOf(hashSection) !== -1) {
            targetSection = hashSection;
          } else {
            var pathSegment = path.replace(/^\//, '').toLowerCase();
            if (validSections.indexOf(pathSegment) !== -1) {
              targetSection = pathSegment;
            }
          }

          // Build standardized canonical URL for search engine indexing
          var resolvedCanonical = origin + '/';
          if (targetSection && targetSection !== 'home') {
            resolvedCanonical = origin + '/#' + targetSection;
          }

          // Preserve project detail canonical if query param exists
          if (window.location.search && (targetSection === 'projects' || hashSection === 'projects')) {
            resolvedCanonical += window.location.search;
          }

          // Update tags immediately during initial HTML parse before React hydration
          canonicalLink.setAttribute('href', resolvedCanonical);
          if (ogUrlMeta) {
            ogUrlMeta.setAttribute('content', resolvedCanonical);
          }
        } catch (e) {
          // Graceful fallback to default base canonical URL
        }
      })();
    </script>
